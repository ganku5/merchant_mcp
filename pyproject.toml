[project]
name = "merchant-mcp"
version = "1.0.0"
description = "Merchant Integration MCP server for Juspay payment integration support"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "mcp>=1.0.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.27",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "litellm>=1.0.0",
    "httpx>=0.26.0",
    "python-multipart>=0.0.9",
    "markitdown>=0.0.1",
    "pdfplumber>=0.10.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "redis>=5.0.0",
    "prometheus-client>=0.19.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
