name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - latest
      - uv-nix-setup
  workflow_dispatch:

env:
  IMAGE_NAME: merchant-mcp

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: amd64
          - runner: ubuntu-24.04-arm
            platform: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      - uses: DeterminateSystems/magic-nix-cache-action@v10

      - name: Build Docker image
        run: |
          nix build .#dockerImage --no-link --print-out-paths --out-link image.tar.gz

      - name: Load into Docker
        run: docker load < image.tar.gz

      - name: Tag and push (per-arch)
        run: |
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          GHCR=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          docker tag merchant-mcp:latest "$GHCR:latest-${{ matrix.platform }}"
          docker tag merchant-mcp:latest "$GHCR:${SHORT_SHA}-${{ matrix.platform }}"
          docker push "$GHCR:latest-${{ matrix.platform }}"
          docker push "$GHCR:${SHORT_SHA}-${{ matrix.platform }}"

  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Create multi-arch manifest
        run: |
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          GHCR=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          docker manifest create "$GHCR:latest" \
            "$GHCR:latest-amd64" \
            "$GHCR:latest-arm64"
          docker manifest annotate "$GHCR:latest" "$GHCR:latest-amd64" --arch amd64
          docker manifest annotate "$GHCR:latest" "$GHCR:latest-arm64" --arch arm64
          docker manifest push "$GHCR:latest"

          docker manifest create "$GHCR:${SHORT_SHA}" \
            "$GHCR:${SHORT_SHA}-amd64" \
            "$GHCR:${SHORT_SHA}-arm64"
          docker manifest annotate "$GHCR:${SHORT_SHA}" "$GHCR:${SHORT_SHA}-amd64" --arch amd64
          docker manifest annotate "$GHCR:${SHORT_SHA}" "$GHCR:${SHORT_SHA}-arm64" --arch arm64
          docker manifest push "$GHCR:${SHORT_SHA}"
