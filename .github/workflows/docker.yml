name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - latest
      - uv-nix-setup
  workflow_dispatch:

env:
  IMAGE_NAME: merchant-mcp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v16

      - uses: DeterminateSystems/magic-nix-cache-action@v10

      - name: Build Docker image
        run: |
          nix build .#dockerImage --no-link --print-out-paths --out-link image.tar.gz

      - name: Load into Docker
        run: docker load < image.tar.gz

      - name: Tag image
        run: |
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          docker tag merchant-mcp:latest ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          docker tag merchant-mcp:latest ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push to GHCR
        run: |
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          docker push ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          docker push ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}
