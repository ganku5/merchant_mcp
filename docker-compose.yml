version: '3.8'

services:
  # PostgreSQL with pgvector
  postgres:
    image: ankane/pgvector:latest
    container_name: merchant-mcp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: merchant_mcp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Merchant MCP Server (pulled from GHCR, built via nix in CI)
  mcp-server:
    image: ghcr.io/ganku5/merchant-mcp:latest
    container_name: merchant-mcp-server
    network_mode: host
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@localhost:5432/merchant_mcp
      - MCP_PORT=8000
    restart: unless-stopped

volumes:
  postgres_data:
